<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Layout Editor</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

#controls {
    background: #222;
    padding: 10px;
    display: flex;
    gap: 10px;
}

#canvas {
    position: relative;
    width: 1280px;
    height: 720px;
    margin: 20px auto;
    border: 2px solid #444;
    overflow: hidden;
    background: black;
}

#backgroundVideo {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.clip {
    position: absolute;
    width: 300px;
    height: 180px;

    background: rgba(20,20,20,0.85);

    border: 2px solid #00d4ff;
    border-radius: 16px;

    resize: both;
    overflow: hidden;

    box-shadow:
        0 0 10px #00d4ff,
        0 0 20px rgba(0,212,255,0.4);

    user-select: none;
}

.clip::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;

    width: 25px;
    height: 25px;

    border-top: 4px solid #00ffff;
    border-left: 4px solid #00ffff;

    border-radius: 12px 0 0 0;

    pointer-events: none;
}

.clip::after {
    content: "";
    position: absolute;
    bottom: 0;
    right: 0;

    width: 25px;
    height: 25px;

    border-bottom: 4px solid #00ffff;
    border-right: 4px solid #00ffff;

    border-radius: 0 0 12px 0;

    pointer-events: none;
}

.titlebar {
    height: 30px;
    background: #00d4ff;
    color: black;
    font-weight: bold;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 8px;
    cursor: move;
}

.closeBtn {
    border: none;
    background: transparent;
    font-size: 18px;
    cursor: pointer;
}

.clip video {
    width: 100%;
    height: calc(100% - 65px);
    object-fit: cover;
}

.loadBtn {
    width: 100%;
    height: 35px;

    border: none;
    background: #1f1f1f;
    color: white;

    cursor: pointer;
}

.preview-mode .titlebar,
.preview-mode .loadBtn {
    display: none;
}

.preview-mode .clip {
    border: none;
    box-shadow: none;
    background: transparent;
}

.preview-mode .clip::before,
.preview-mode .clip::after {
    display: none;
}

.preview-mode .clip video {
    height: 100%;
}
</style>
</head>

<body>

<div id="controls">
    <input type="file" id="bgInput" accept="video/*">
    <button onclick="addClip()">Add Clip Box</button>
</div>

<div id="canvas">
    <video id="backgroundVideo" controls></video>
</div>

<script>
const bgInput = document.getElementById("bgInput");
const backgroundVideo = document.getElementById("backgroundVideo");
const canvas = document.getElementById("canvas");

bgInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    backgroundVideo.src = URL.createObjectURL(file);
});

function addClip() {

    const clip = document.createElement("div");
    clip.className = "clip";

    clip.style.left = "100px";
    clip.style.top = "100px";

    const titlebar = document.createElement("div");
    titlebar.className = "titlebar";
    titlebar.innerHTML = `
        <span>Clip</span>
        <button class="closeBtn">✖</button>
    `;

    const video = document.createElement("video");
    video.controls = true;

    const loadBtn = document.createElement("button");
    loadBtn.className = "loadBtn";
    loadBtn.textContent = "🎬 Load Video";

    const input = document.createElement("input");
    input.type = "file";
    input.accept = "video/*";
    input.style.display = "none";

    loadBtn.onclick = () => input.click();

    input.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        video.src = URL.createObjectURL(file);
    });

    titlebar.querySelector(".closeBtn").onclick = () => {
        clip.remove();
    };

    clip.appendChild(titlebar);
    clip.appendChild(video);
    clip.appendChild(loadBtn);
    clip.appendChild(input);

    canvas.appendChild(clip);

    makeDraggable(clip, titlebar);
}

function makeDraggable(element, handle) {

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    handle.addEventListener("mousedown", (e) => {
        dragging = true;

        offsetX = e.clientX - element.offsetLeft;
        offsetY = e.clientY - element.offsetTop;
    });

    document.addEventListener("mousemove", (e) => {

        if (!dragging) return;

        element.style.left =
            (e.clientX - offsetX) + "px";

        element.style.top =
            (e.clientY - offsetY) + "px";
    });

    document.addEventListener("mouseup", () => {
        dragging = false;
    });
}

    let previewMode = false;

document.addEventListener("keydown", (e) => {

    if (e.ctrlKey && e.key.toLowerCase() === "p") {

        e.preventDefault();

        previewMode = !previewMode;

        if (previewMode) {
            document.body.classList.add("preview-mode");
        } else {
            document.body.classList.remove("preview-mode");
        }
    }
});
</script>

</body>
</html>
